<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloudinary Asset Sync</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu,
          Cantarell, sans-serif;
        padding: 20px;
        background: var(--vscode-editor-background);
        color: var(--vscode-editor-foreground);
      }
      .container {
        max-width: 600px;
        margin: 0 auto;
      }
      h2 {
        margin-bottom: 20px;
        font-size: 24px;
      }
      .button-group {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }
      button {
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        background: var(--vscode-button-background);
        color: var(--vscode-button-foreground);
        cursor: pointer;
        font-size: 14px;
        transition: background 0.2s;
      }
      button:hover {
        background: var(--vscode-button-hoverBackground);
      }
      #log {
        background: var(--vscode-input-background);
        border: 1px solid var(--vscode-input-border);
        border-radius: 4px;
        padding: 10px;
        height: 300px;
        overflow-y: auto;
        font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
        font-size: 12px;
        line-height: 1.5;
        color: var(--vscode-input-foreground);
      }
      .log-entry {
        margin: 5px 0;
        padding: 5px;
      }
      .log-info {
        color: #6a9955;
      }
      .log-error {
        color: #d16969;
      }
      .log-warn {
        color: #dcdcaa;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>🌩️ Cloudinary Asset Sync</h2>

      <div class="button-group">
        <button onclick="sync()">▶ Run Sync</button>
        <button onclick="watch()">👀 Watch Mode</button>
        <button onclick="clearLog()">🗑️ Clear Log</button>
      </div>

      <div id="log"></div>
    </div>

    <script>
      const vscode = acquireVsCodeApi();

      function log(message, type = 'info') {
        const logDiv = document.getElementById('log');
        const entry = document.createElement('div');
        entry.className = `log-entry log-${type}`;
        entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
        logDiv.appendChild(entry);
        logDiv.scrollTop = logDiv.scrollHeight;
      }

      function sync() {
        log('Starting sync...', 'info');
        vscode.postMessage({ command: 'sync' });
      }

      function watch() {
        log('Enabling watch mode...', 'info');
        vscode.postMessage({ command: 'watch' });
      }

      function clearLog() {
        document.getElementById('log').innerHTML = '';
        log('Log cleared', 'info');
      }

      window.addEventListener('message', (event) => {
        const message = event.data;
        if (message.type === 'log') {
          log(message.text, message.level || 'info');
        }
      });

      log('Cloudinary Asset Sync Ready', 'info');
    </script>
  </body>
</html>
